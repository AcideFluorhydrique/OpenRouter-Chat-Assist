name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Test
        run: python -m unittest discover -s tests -t .

      - name: Build
        run: python build.py

      - name: Check output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/OpenRouterChat.exe)) { throw "dist/OpenRouterChat.exe not found" }
          Get-Item dist/OpenRouterChat.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: OpenRouterChat-windows
          path: dist/OpenRouterChat.exe

      # 推送 v* 标签时自动发布 Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenRouterChat.exe
